# Render blueprint: free zero-cost deploy of the Protein Annotation Workbench.
# Dashboard: New+ -> Web Service -> connect this repo -> Render reads this file.
services:
  - type: web
    name: protein-workbench
    runtime: python
    plan: free
    buildCommand: "pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
